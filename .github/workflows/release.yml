name: release
# Builds unsigned installers for macOS, Windows and Linux when a version tag (v*) is pushed and
# attaches them to a draft GitHub release, which a maintainer reviews and publishes.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "Quorum $TAG" --notes "Draft: notes to follow."
  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install Trunk and the Tauri CLI
        run: cargo install --locked trunk@0.21.14 tauri-cli@2.12.3
      - name: Build the UI
        run: cargo xtask ui --release
      - name: Build installers
        working-directory: apps/quorum
        run: cargo tauri build --target ${{ matrix.target }}
      - name: Attach to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          dir="target/${{ matrix.target }}/release/bundle"
          find "$dir" -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -print0 \
            | xargs -0 gh release upload "$TAG" --clobber
